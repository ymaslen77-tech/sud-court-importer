services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: courts
      POSTGRES_USER: courts
      POSTGRES_PASSWORD: courts
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U courts -d courts']
      interval: 5s
      retries: 10
volumes:
  pgdata:
