name: Live dated court-roster release acceptance
on:
  push:
    branches: [ops/roster-public-smoke-2026-10-18]
permissions:
  contents: read
jobs:
  live-rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify 10 production pages and exactly four official roster sections
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          import json,time
          from concurrent.futures import ThreadPoolExecutor
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          HOST='https://sudy-rossii.vercel.app'
          EXPECT={
           '54aj0005':['Сумачакова Наталья Игнатьевна','Мулярчик Андрей Иванович','90КД/67'],
           '54os0000':['Дмитревский Павел Львович','Деменкова Юлия Геннадьевна','Шумова Наталья Александровна'],
           '54rs0002':['Певина Елена Анатольевна','Полуэктова Мария Борисовна'],
           '54rs0004':['Мяленко Мария Николаевна','Дудина Дарья Игоревна']
          }
          CODES=['54rs0012','55os0000','54os0000','54aj0005','54gv0001','54kv0000','54rs0001','54rs0002','54rs0003','54rs0004']
          class Extract(HTMLParser):
           def __init__(self):super().__init__();self.parts=[];self.anchors=[]
           def handle_starttag(self,tag,attrs):
            if tag=='section':
             a=dict(attrs)
             self.anchors.append(a.get('id',''))
           def handle_data(self,data):self.parts.append(data)
          def get(url):
           for i in range(3):
            try:
             req=urllib.request.Request(url,headers={'User-Agent':'SudyRossii-Release-QA/2026','Accept':'text/html'})
             with urllib.request.urlopen(req,timeout=35) as response:
              assert response.status==200,(url,response.status)
              assert urlsplit(response.url).hostname=='sudy-rossii.vercel.app'
              return response.read(3_000_000).decode('utf-8')
            except Exception:
             if i==2:raise
             time.sleep(2)
          def check(code):
           region='55' if code.startswith('55') else '54'
           html=get(f'{HOST}/courts/region-{region}/sud-{code}')
           p=Extract();p.feed(html);text=' '.join(p.parts)
           assert 'Поиск дела по номеру' in text,(code,'case search')
           assert 'Государственная пошлина' in text,(code,'filing fees')
           assert 'Суд на Яндекс Картах' in text,(code,'map')
           if code in EXPECT:
            assert 'pilot-roster-publication' in p.anchors,(code,'roster section missing')
            assert 'не подтверждение действующих полномочий сегодня' in text,(code,'missing stale-roster warning')
            for name in EXPECT[code]:assert name in text,(code,'missing published name',name)
           else:
            assert 'pilot-roster-publication' not in p.anchors,(code,'unsourced judge roster')
           print('PASS '+code+' roster='+str(code in EXPECT),flush=True)
          with ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(check,CODES))
          try:
           req=urllib.request.Request(HOST+'/jurisdiction',headers={'User-Agent':'SudyRossii-Release-QA/2026'})
           with urllib.request.urlopen(req,timeout=25) as response:
            code=response.status
          except urllib.error.HTTPError as error:
           code=error.code
          assert code==503,('jurisdiction should be fail-closed',code)
          print('PASS ALL TEN. 4 dated roster cards, 6 other intact, territorial lookup blocked.',flush=True)
          PY
