name: Production public smoke
on:
  push:
    branches: [ops/production-smoke-2026-10-16]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm real production domains, ten public court cards, search and sitemap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          WEB='https://sudy-rossii.vercel.app'
          API='https://sudy-rossii-api.vercel.app'
          CODES=['54rs0012','55os0000','54os0000','54aj0005',
                 '54gv0001','54kv0000','54rs0001','54rs0002',
                 '54rs0003','54rs0004']
          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.robots=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='meta' and a.get('name','').lower()=='robots':
                      self.robots.append(a.get('content','').lower())
          def get(path,api=False):
              root=API if api else WEB
              url=root+path
              error=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'SudyRossii-Release-SMOKE/1.0'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          if r.status!=200: raise AssertionError(f'HTTP {r.status}: {url}')
                          b=r.read(3000000)
                          print(f'PASS HTTP {r.status}: {url} ({len(b)} bytes)',flush=True)
                          return b.decode('utf-8')
                  except Exception as exc:
                      error=exc
                      if attempt<2:time.sleep(2)
              raise AssertionError(f'LIVE REQUEST FAILED: {url}: {type(error).__name__}: {error}')
          status=json.loads(get('/api/status'))
          assert status['published_source_reference_count']==10,status
          assert status['automated_source_collection'] is False,status
          health=json.loads(get('/api/v1/health',api=True))
          assert health['status']=='ok' and health['database']=='reachable',health
          records=json.loads(get('/api/v1/courts/reference-profiles',api=True))
          assert len(records)==10,len(records)
          assert {r['external_code'].lower() for r in records}==set(CODES)
          assert all(r['publication_class']=='sourced_reference' and not r['current_freshness_attested'] for r in records)
          html=get('/courts')
          assert 'подробных справочных карточек' in html, 'Expected pilot directory heading missing'
          for code in CODES:
              region='55' if code=='55os0000' else '54'
              path=f'/courts/region-{region}/sud-{code}'
              page=get(path)
              assert 'Публичная справочная карточка' in page,path
              assert 'официальных источников' in page,path
              parser=MetaParser()
              parser.feed(page)
              assert not any('noindex' in a for a in parser.robots),(path,parser.robots)
              assert code.upper() in page,('missing classification code',path)
          other=get('/courts/region-54/sud-54rs0005')
          parser=MetaParser()
          parser.feed(other)
          assert any('noindex' in a for a in parser.robots),parser.robots
          query=get('/search?q=55OS0000')
          assert 'Омский областной суд' in query
          sitemap=ET.fromstring(get('/sitemap.xml'))
          locs={x.text for x in sitemap.iter() if x.tag.endswith('loc') and x.text}
          for code in CODES:
              region='55' if code=='55os0000' else '54'
              path=f'/courts/region-{region}/sud-{code}'
              assert WEB+path in locs,('not in sitemap',path)
          assert WEB+'/courts/region-54/sud-54rs0005' not in locs
          print(f'PASS RELEASE SMOKE: 10/10 public profiles, API 10 records, search, sitemap and noindex boundary.',flush=True)
          PY
