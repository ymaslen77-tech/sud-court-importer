name: Rich public court cards smoke
on:
  push:
    branches: [ops/rich-court-smoke-2026-10-16]
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test all ten public cards and current-day guarding
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from html.parser import HTMLParser
          import urllib.request
          import datetime,re
          from zoneinfo import ZoneInfo
          CODES=['54rs0012','55os0000','54os0000','54aj0005','54gv0001','54kv0000','54rs0001','54rs0002','54rs0003','54rs0004']
          BASE='https://sudy-rossii.vercel.app'
          class Parser(HTMLParser):
              def __init__(self):super().__init__();self.text=[];self.iframes=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='iframe':self.iframes.append(dict(attrs).get('src',''))
              def handle_data(self,data):self.text.append(data)
          def check(code):
              region='55' if code.startswith('55') else '54'
              url=f'{BASE}/courts/region-{region}/sud-{code}'
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CourtReleaseSmoke/1.0'}),timeout=35) as resp:
                  assert resp.status==200,(code,resp.status)
                  html=resp.read(1800000).decode('utf8')
              p=Parser();p.feed(html)
              text=' '.join(p.text)
              expected=datetime.datetime.now(ZoneInfo('Asia/Omsk' if region=='55' else 'Asia/Novosibirsk')).strftime('%d.%m.%Y')
              for term in ['Как подать документы в суд','Государственная пошлина','Заседания на сегодня','Суд на Яндекс Картах','Электронная подпись']:
                  assert term in text,(code,'missing',term)
              assert expected in text,(code,'today heading',expected)
              assert any('yandex.ru/map-widget/v1/?' in u for u in p.iframes),(code,'yandex iframe absent')
              assert ('Сегодняшнее расписание временно недоступно' in text or 'На сегодня дела не назначены' in text or 'номер дела' in text.lower()),(code,'current day result absent')
              assert 'Первые 10' not in text or code,(code,'unexpected catalog')
              print('PASS',code,'today',expected,'Yandex iframe, fees, filing and schedule state',flush=True)
          with ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(check,CODES))
          print('PASS RICH-COURT PUBLIC 10/10',flush=True)
          PY
