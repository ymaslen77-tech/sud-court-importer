name: Moscow GitHub-only data and website checks

on:
  push:
    branches:
      - infra/coolify-russian-vps
    paths:
      - 'apps/web/app/courts/moscow/**'
      - 'apps/web/app/_components/moscow-*'
      - 'apps/web/app/lib/moscow-*'
      - 'apps/web/app/globals.css'
      - 'apps/web/app/data/moscow-*.json'
      - 'importer/**'
      - 'docs/moscow-github-only-workflow.md'
      - '.github/workflows/moscow-github-only-quality.yml'
  pull_request:
    paths:
      - 'apps/web/app/courts/moscow/**'
      - 'apps/web/app/_components/moscow-*'
      - 'apps/web/app/lib/moscow-*'
      - 'apps/web/app/globals.css'
      - 'apps/web/app/data/moscow-*.json'
      - 'importer/**'
      - '.github/workflows/moscow-github-only-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moscow-github-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect source inventory and privacy in published JSON
        run: |
          python3 -m unittest discover -s importer/tests -p 'test_moscow_github_data_gate.py' -v
          python3 importer/moscow_github_data_gate.py
      - name: Cross-check sourced court reference fields
        run: |
          python3 -m unittest discover -s importer/tests -p 'test_moscow_source_facts_quality.py' -v
          python3 -m unittest discover -s importer/tests -p 'test_moscow_oblast_reference_cards.py' -v
          python3 -m unittest discover -s importer/tests -p 'test_official_region_reference_results.py' -v
          python3 -m unittest discover -s importer/tests -p 'test_moscow_research_readiness.py' -v
          python3 -m unittest discover -s importer/tests -p 'test_moscow_case_index.py' -v
          python3 -m unittest discover -s importer/tests -p 'test_moscow_appeal_hearing_snapshots.py' -v
          python3 importer/verify_moscow_appeal_hearing_snapshots.py
      - name: Publication boundary summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Безопасность данных судебного каталога
          Проверены ссылки на официальные наборы, структура публичных JSON, статус неподтверждённых судебных актов и отсутствие сырых выгрузок в Git.
          Этот workflow не подключается к VPS, не скачивает дела, не импортирует персональные данные и не запускает Deploy.
          EOF

  website-build:
    needs: source-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
