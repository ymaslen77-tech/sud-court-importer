name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Parse backup-first Windows update PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/update-local-safe.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            exit 1
          }
      - run: pnpm check
      - run: pnpm build

  windows-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell update scripts
        shell: pwsh
        run: |
          foreach ($file in @('scripts/safe-update-local.ps1','scripts/apply-import-migration.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell parse errors in $file"
            }
          }
          Write-Host 'PowerShell source parsed successfully'

  importer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11.0,<12'
      - run: python -m unittest discover -s importer/tests -v

  local-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose -f compose.local.yaml config --quiet
      - name: Build and start the dedicated local host
        run: docker compose -f compose.local.yaml up --build --detach --wait --wait-timeout 240
      - name: Check database backup and reapplicable schema migrations
        run: |
          docker compose -f compose.local.yaml exec -T postgres pg_dump -U courts -d courts -Fc -f /tmp/ci-preupgrade.dump
          docker compose -f compose.local.yaml exec -T postgres pg_restore --list /tmp/ci-preupgrade.dump > /tmp/dump-manifest.txt
          grep -Fq 'TOC Entries:' /tmp/dump-manifest.txt
          for f in db/migrations/00{2,3,4,5,6,7}_*.sql; do
            test -f "$f"
            docker compose -f compose.local.yaml exec -T postgres psql -v ON_ERROR_STOP=1 -U courts -d courts < "$f" > /dev/null
          done
      - name: Stage synthetic candidate without publication
        run: |
          mkdir -p data/import
          cp importer/tests/fixtures/synthetic_contacts.json data/import/contacts.json
          docker compose -f compose.local.yaml build importer
          docker compose -f compose.local.yaml run --rm importer validate /input/contacts.json > /tmp/validate.json
          docker compose -f compose.local.yaml run --rm importer stage /input/contacts.json --source-url https://data.mos-gorsud.ru/opendata > /tmp/stage.json
          grep -Fq '"published": 0' /tmp/stage.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_import_rows;' | grep -Fqx 1
          cp importer/seeds/novosibirsk-federal-official-unreviewed.json data/import/federal.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/federation.py validate /input/federal.json --registry sudrf-federal > /tmp/federal-validate.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/federation.py stage /input/federal.json --registry sudrf-federal > /tmp/federal-stage.json
          grep -Fq '"published": 0' /tmp/federal-stage.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_import_rows;' | grep -Fqx 11
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM courts;' | grep -Fqx 0
          cp importer/tests/fixtures/official_sudrf_novosibirsk_excerpt.txt data/import/regional-snapshot.txt
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/sudrf_listing.py validate /input/regional-snapshot.txt --region 54 --region-name "Новосибирская область" --source-url 'https://sudrf.ru/index.php?act=go_search&court_subj=54&id=300&searchtype=fs' > /tmp/regional-valid.json
          grep -Fq '"records": 4' /tmp/regional-valid.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/sudrf_listing.py sync /input/regional-snapshot.txt --region 54 --region-name "Новосибирская область" --source-url 'https://sudrf.ru/index.php?act=go_search&court_subj=54&id=300&searchtype=fs' --captured-on "$(date -u +%F)" --reviewer "CI Synthetic Test" --attest-reuse-rights > /tmp/regional-stage.json
          grep -Fq '"published": 0' /tmp/regional-stage.json
          grep -Fq '"auto_published": 0' /tmp/regional-stage.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_import_batches WHERE primary_snapshot_sha256 IS NOT NULL AND snapshot_use_attested=true;' | grep -Fqx 1
          OLD_BATCH="$(python3 -c 'import json;print(json.load(open("/tmp/federal-stage.json"))["batch_id"])')"
          NEW_BATCH="$(python3 -c 'import json;print(json.load(open("/tmp/regional-stage.json"))["batch_id"])')"
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/registry_diff.py queue --older-batch "$OLD_BATCH" --newer-batch "$NEW_BATCH" > /tmp/courts-diff.json
          grep -Fq '"new": 2' /tmp/courts-diff.json
          grep -Fq '"missing": 0' /tmp/courts-diff.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_import_rows;' | grep -Fqx 15
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_registry_diff_runs;' | grep -Fqx 1
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/sudrf_listing.py sync /input/regional-snapshot.txt --region 54 --region-name "Новосибирская область" --source-url 'https://sudrf.ru/index.php?act=go_search&court_subj=54&id=300&searchtype=fs' --captured-on "$(date -u +%F)" --reviewer "CI Synthetic Test" --attest-reuse-rights > /tmp/regional-repeat.json
          grep -Fq '"created": false' /tmp/regional-repeat.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_registry_diff_runs;' | grep -Fqx 1
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_import_rows;' | grep -Fqx 15
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM courts;' | grep -Fqx 0

          cp importer/seeds/arbitration-subjects-official-list-unreviewed.json data/import/arbitration-discoveries.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py validate /input/arbitration-discoveries.json > /tmp/discovery-valid.json
          grep -Fq '"records": 89' /tmp/discovery-valid.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py stage /input/arbitration-discoveries.json --captured-on "$(date -u +%F)" > /tmp/discovery-stage.json
          grep -Fq '"published": 0' /tmp/discovery-stage.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py stage /input/arbitration-discoveries.json --captured-on "$(date -u +%F)" > /tmp/discovery-repeated.json
          grep -Fq '"created": false' /tmp/discovery-repeated.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_discovery_rows;' | grep -Fqx 89
          cp importer/seeds/arbitration-appellate-district-ip-official-unreviewed.json data/import/arbitration-all-levels.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py validate /input/arbitration-all-levels.json > /tmp/arbitration-all-levels-valid.json
          grep -Fq '"records": 32' /tmp/arbitration-all-levels-valid.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py stage /input/arbitration-all-levels.json --captured-on "$(date -u +%F)" > /tmp/arbitration-all-levels-stage.json
          grep -Fq '"published": 0' /tmp/arbitration-all-levels-stage.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_discovery_rows;' | grep -Fqx 121
          cp importer/seeds/khabarovsk-magistrates-official-unreviewed.json data/import/magistrates.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py validate /input/magistrates.json > /tmp/magistrates-valid.json
          grep -Fq '"records": 75' /tmp/magistrates-valid.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py stage /input/magistrates.json --captured-on "$(date -u +%F)" > /tmp/magistrates-stage.json
          grep -Fq '"published": 0' /tmp/magistrates-stage.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_discovery_rows;' | grep -Fqx 196
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM courts;' | grep -Fqx 0
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/coverage.py > /tmp/coverage-report.json
          grep -Fq '"public_courts_verified": 0' /tmp/coverage-report.json
          grep -Fq '"registry_differences": 4' /tmp/coverage-report.json
          grep -Fq '"registered_enabled": 0' /tmp/coverage-report.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/readiness.py --public-url https://courts.example > /tmp/court-readiness.json
          grep -Fq '"pilot_technical_ready": false' /tmp/court-readiness.json
          grep -Fq '"nationwide_complete": "NOT_ASSESSED"' /tmp/court-readiness.json
          if docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/readiness.py --public-url https://courts.example --fail-if-not-ready; then
            echo "Unexpected green production gate against empty synthetic CI database" >&2
            exit 1
          fi
      - name: Exercise Moscow normalized contact snapshot and retry-safe diff
        run: |
          cp importer/tests/fixtures/synthetic_contacts.json data/import/moscow-old.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path("data/import/moscow-old.json").read_text(encoding="utf-8"))
          source[0]["courtTelephone"]="+7 000 111 00 00"
          Path("data/import/moscow-new.json").write_text(json.dumps(source,ensure_ascii=False),encoding="utf-8")
          PY
          URL="https://data.mos-gorsud.ru/opendata/TEST-ONLY-DATASET-00001"
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/moscow_sync.py validate /input/moscow-old.json > /tmp/moscow-valid.json
          grep -Fq '"records": 1' /tmp/moscow-valid.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/moscow_sync.py sync /input/moscow-old.json --dataset-url "$URL" --captured-on "$(date -u +%F)" --reviewer "CI Synthetic Test" --attest-reuse-rights > /tmp/moscow-first.json
          grep -Fq '"auto_published": 0' /tmp/moscow-first.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/moscow_sync.py sync /input/moscow-new.json --dataset-url "$URL" --captured-on "$(date -u +%F)" --reviewer "CI Synthetic Test" --attest-reuse-rights > /tmp/moscow-second.json
          grep -Fq '"changed_fields": 1' /tmp/moscow-second.json
          grep -Fq '"auto_published": 0' /tmp/moscow-second.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path("data/import/moscow-new.json").read_text(encoding="utf-8"))
          Path("data/import/moscow-reformatted.json").write_text(
            json.dumps(rows,ensure_ascii=False,sort_keys=True,indent=4),encoding="utf-8"
          )
          PY
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/moscow_sync.py sync /input/moscow-reformatted.json --dataset-url "$URL" --captured-on "$(date -u +%F)" --reviewer "CI Synthetic Test" --attest-reuse-rights > /tmp/moscow-repeat.json
          grep -Fq '"created": false' /tmp/moscow-repeat.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM court_registry_diff_items WHERE field_name='phone';" | grep -Fqx 1
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM courts;" | grep -Fqx 0
      - name: Verify approved offline inbox scan and idempotent sync
        run: |
          mkdir -p data/import/inbox
          cp data/import/moscow-new.json data/import/inbox/contacts.json
          python3 - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          manifest={
            "format":"moscow-contacts-v1",
            "file":"inbox/contacts.json",
            "dataset_url":"https://data.mos-gorsud.ru/opendata/TEST-ONLY-DATASET-00001",
            "captured_on":str(date.today()),
            "reviewer":"CI Test Operator",
            "reuse_rights_confirmed":True
          }
          Path("data/import/inbox/contacts.manifest.json").write_text(json.dumps(manifest),encoding="utf-8")
          PY
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/inbox.py check > /tmp/inbox-check.json
          grep -Fq '"handled": 1' /tmp/inbox-check.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/inbox.py stage > /tmp/inbox-stage.json
          grep -Fq '"created": false' /tmp/inbox-stage.json
          grep -Fq '"auto_published": 0' /tmp/inbox-stage.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM court_registry_diff_runs;" | grep -Fqx 2
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM courts;" | grep -Fqx 0
      - name: Stage 11 official roster references without verifying appointments
        run: |
          cp importer/seeds/lefortovsky-judges-official-page-unreviewed.json data/import/lef-roster.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/roster.py validate /input/lef-roster.json > /tmp/lef-roster-valid.json
          grep -Fq '"rows": 11' /tmp/lef-roster-valid.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/roster.py stage /input/lef-roster.json --captured-on "$(date -u +%F)" --reviewer "CI Synthetic Reviewer" --attest-source-observed > /tmp/lef-roster-stage.json
          grep -Fq '"published": 0' /tmp/lef-roster-stage.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/roster.py stage /input/lef-roster.json --captured-on "$(date -u +%F)" --reviewer "CI Synthetic Reviewer" --attest-source-observed > /tmp/lef-roster-repeat.json
          grep -Fq '"created": false' /tmp/lef-roster-repeat.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM court_staff_roster_rows;" | grep -Fqx 11
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM judicial_appointments;" | grep -Fqx 0
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM courts;" | grep -Fqx 0
      - name: Stage official-page court pilot without premature publication
        run: |
          cp importer/seeds/lefortovsky-official-page-staging-unreviewed.json data/import/lefortovsky-pilot.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/federation.py validate /input/lefortovsky-pilot.json --registry mos-gorsud-court > /tmp/lefortovsky-valid.json
          grep -Fq '"records": 1' /tmp/lefortovsky-valid.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/federation.py stage /input/lefortovsky-pilot.json --registry mos-gorsud-court > /tmp/lefortovsky-staged.json
          grep -Fq '"published": 0' /tmp/lefortovsky-staged.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM court_import_rows WHERE external_code='77RS0014' AND review_status='pending';" | grep -Fqx 1
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM courts;" | grep -Fqx 0
      - name: Check API and HTML response
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4174/api/v1/health > /tmp/api-health.json
          grep -Fqx '{"status":"ok"}' /tmp/api-health.json
          curl --fail --silent --show-error http://127.0.0.1:4174/api/v1/regions > /tmp/regions.json
          grep -Fqx '[]' /tmp/regions.json
          curl --fail --silent --show-error http://127.0.0.1:4174/api/v1/courts/categories/general-district > /tmp/courts-category.json
          grep -Fqx '{"items":[],"total":0,"page":1,"pageSize":50}' /tmp/courts-category.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4174/api/v1/courts/categories/general-district?page=0')" = 400
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4174/api/v1/courts/categories/invalid-kind)" = 404
          curl --fail --silent --show-error 'http://127.0.0.1:4174/api/v1/courts/search?q=moscow' > /tmp/courts.json
          grep -Fqx '[]' /tmp/courts.json
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/home.html
          grep -Fq 'Правосудие.' /tmp/home.html
          curl --fail --silent --show-error http://127.0.0.1:4173/courts/arbitration > /tmp/arbitration.html
          grep -Fq 'Арбитражные суды России' /tmp/arbitration.html
          curl --fail --silent --show-error http://127.0.0.1:4173/courts/magistrates > /tmp/magistrates.html
          grep -Fq 'Судебные участки мировых судей' /tmp/magistrates.html
          for page in courts/types courts/types/general-district courts/types/general-regional courts/types/military-garrison courts/types/arbitration-subject; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:4173/$page"
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/judges > /tmp/judges.html
          grep -Fq 'Судьи Российской Федерации' /tmp/judges.html
          for page in courts judges laws practice guides jurisdiction services sources search; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:4173/$page"
          done
      - name: Verify reviewed profile updates and monitoring storage (ephemeral CI only)
        run: |
          docker compose -f compose.local.yaml exec -T postgres psql -v ON_ERROR_STOP=1 -U courts -d courts -c "INSERT INTO regions(code,name,slug) VALUES('99','TEST ONLY REGION','test-99') ON CONFLICT DO NOTHING"
          docker compose -f compose.local.yaml exec -T postgres psql -v ON_ERROR_STOP=1 -U courts -d courts -c "INSERT INTO courts(region_id,name,slug,court_type,address,official_url,status,verified_at) SELECT id,'TEST ONLY COURT','test-court','TEST TYPE','synthetic no real address','https://sudrf.ru/','verified',now() FROM regions WHERE code='99'"
          COURT_ID="$(docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT id FROM courts WHERE slug='test-court' LIMIT 1" | tr -d '\r')"
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/profile.py propose --court-id "$COURT_ID" --field coordinates --value '{"latitude":55.75,"longitude":37.6}' --source-url https://sudrf.ru/ --observer "CI Synthetic Test" > /tmp/profile-proposal.json
          grep -Fq '"published": 0' /tmp/profile-proposal.json
          CANDIDATE_ID="$(python3 -c 'import json; print(json.load(open("/tmp/profile-proposal.json"))["candidate_id"])')"
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/profile.py approve --candidate-id "$CANDIDATE_ID" --reviewer "CI Synthetic Test" --attest-current --attest-rights > /tmp/profile-approved.json
          grep -Fq '"changed": true' /tmp/profile-approved.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM change_events WHERE entity_type='court' AND changed_field='coordinates';" | grep -Fqx 1
          curl --fail --silent --show-error http://127.0.0.1:4174/api/v1/regions/test-99/courts/test-court > /tmp/test-court.json
          grep -Fq '"latitude":55.75' /tmp/test-court.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/watch.py register --court-id "$COURT_ID" --url https://sudrf.ru/ --scope general --reviewer "CI Synthetic Test" --attest-permission > /tmp/watch-registered.json
          grep -Fq '"created": true' /tmp/watch-registered.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM court_source_watch;" | grep -Fqx 1
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM court_source_watch_events;" | grep -Fqx 0
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -c "INSERT INTO court_source_watch_events(watch_id,old_sha256,new_sha256) SELECT id,repeat('a',64),repeat('b',64) FROM court_source_watch LIMIT 1"
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/watch.py pending > /tmp/watch-pending.json
          grep -Fq '"pending": 1' /tmp/watch-pending.json
          EVENT_ID="$(docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT id FROM court_source_watch_events LIMIT 1" | tr -d '\r')"
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/watch.py review --event-id "$EVENT_ID" --reviewer "CI Synthetic Test" --attest-reviewed > /tmp/watch-reviewed.json
          grep -Fq '"status": "reviewed"' /tmp/watch-reviewed.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/watch.py pending | grep -Fq '"pending": 0'
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/judges.py nominate --court-id "$COURT_ID" --full-name "CI Test Judge Only" --position "Test judge" --source-url https://sudrf.ru/ --observer "CI Synthetic Test" > /tmp/judge-proposal.json
          grep -Fq '"published": 0' /tmp/judge-proposal.json
          JUDGE_CANDIDATE="$(python3 -c 'import json;print(json.load(open("/tmp/judge-proposal.json"))["candidate_id"])')"
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/judges.py approve --candidate-id "$JUDGE_CANDIDATE" --reviewer "CI Synthetic Test" --attest-current --attest-identity > /tmp/judge-approved.json
          grep -Fq '"status": "approved"' /tmp/judge-approved.json
          curl --fail --silent --show-error http://127.0.0.1:4174/api/v1/regions/test-99/courts/test-court | grep -Fq 'CI Test Judge Only'
          APPOINTMENT_ID="$(python3 -c 'import json;print(json.load(open("/tmp/judge-approved.json"))["appointment_id"])')"
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/judges.py close --appointment-id "$APPOINTMENT_ID" --ended-on "$(date -u -d yesterday +%F)" --source-url https://sudrf.ru/ --reviewer "CI Synthetic Test" --attest-current > /tmp/judge-closed.json
          grep -Fq '"status": "closed"' /tmp/judge-closed.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc "SELECT count(*) FROM change_events WHERE entity_type='judge';" | grep -Fqx 2
          curl --fail --silent --show-error http://127.0.0.1:4173/sitemap.xml | grep -Fq '<urlset'
      - name: End-to-end proof for a reviewed official court-case link (ephemeral DB only)
        run: |
          PILOT_BATCH="$(python3 -c 'import json;print(json.load(open("/tmp/lefortovsky-staged.json"))["batch_id"])')"
          docker compose -f compose.local.yaml run --rm importer approve --batch "$PILOT_BATCH" --code 77RS0014 --reviewer "CI simulated editor - test only" --checked-on "$(date -u +%F)" --verification-url https://mos-gorsud.ru/rs/lefortovskij --attest-current --attest-reuse-rights > /tmp/lefortovsky-published-test.json
          PILOT_ID="$(python3 -c 'import json;print(json.load(open("/tmp/lefortovsky-published-test.json"))["court_id"])')"
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/cases.py propose --court-id "$PILOT_ID" --uid 77RS0014-02-2026-011129-45 --number 02-7949/2026 --source-url https://m.mos-gorsud.ru/rs/lefortovskij/services/cases/civil/details/fef64000-869b-11f1-ade9-3f611993f6c1 --observer "CI simulated editor - test only" > /tmp/case-proposal.json
          grep -Fq '"published": 0' /tmp/case-proposal.json
          curl --fail --silent --show-error http://127.0.0.1:4174/api/v1/regions/moscow/courts/sud-77rs0014 | grep -Fq '"cases":[]'
          CASE_CANDIDATE="$(python3 -c 'import json;print(json.load(open("/tmp/case-proposal.json"))["candidate_id"])')"
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/cases.py approve --candidate-id "$CASE_CANDIDATE" --reviewer "CI simulated editor - test only" --attest-current --attest-reuse-rights > /tmp/case-approved.json
          grep -Fq '"published": 1' /tmp/case-approved.json
          curl --fail --silent --show-error http://127.0.0.1:4174/api/v1/regions/moscow/courts/sud-77rs0014 | grep -Fq '02-7949/2026'
          curl --fail --silent --show-error http://127.0.0.1:4173/courts/moscow/sud-77rs0014 | grep -Fq '02-7949/2026'
      - name: Shut down and clean smoke-test containers
        if: always()
        run: docker compose -f compose.local.yaml down --volumes
