name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  importer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s importer/tests -v

  local-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose -f compose.local.yaml config --quiet
      - name: Build and start the dedicated local host
        run: docker compose -f compose.local.yaml up --build --detach --wait --wait-timeout 240
      - name: Stage synthetic candidate without publication
        run: |
          mkdir -p data/import
          cp importer/tests/fixtures/synthetic_contacts.json data/import/contacts.json
          docker compose -f compose.local.yaml build importer
          docker compose -f compose.local.yaml run --rm importer validate /input/contacts.json > /tmp/validate.json
          docker compose -f compose.local.yaml run --rm importer stage /input/contacts.json --source-url https://data.mos-gorsud.ru/opendata > /tmp/stage.json
          grep -Fq '"published": 0' /tmp/stage.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_import_rows;' | grep -Fqx 1
          cp importer/seeds/novosibirsk-federal-official-unreviewed.json data/import/federal.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/federation.py validate /input/federal.json --registry sudrf-federal > /tmp/federal-validate.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/federation.py stage /input/federal.json --registry sudrf-federal > /tmp/federal-stage.json
          grep -Fq '"published": 0' /tmp/federal-stage.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_import_rows;' | grep -Fqx 11
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM courts;' | grep -Fqx 0
          cp importer/seeds/arbitration-subjects-official-list-unreviewed.json data/import/arbitration-discoveries.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py validate /input/arbitration-discoveries.json > /tmp/discovery-valid.json
          grep -Fq '"records": 89' /tmp/discovery-valid.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py stage /input/arbitration-discoveries.json --captured-on "$(date -u +%F)" > /tmp/discovery-stage.json
          grep -Fq '"published": 0' /tmp/discovery-stage.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py stage /input/arbitration-discoveries.json --captured-on "$(date -u +%F)" > /tmp/discovery-repeated.json
          grep -Fq '"created": false' /tmp/discovery-repeated.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_discovery_rows;' | grep -Fqx 89
          cp importer/seeds/khabarovsk-magistrates-official-unreviewed.json data/import/magistrates.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py validate /input/magistrates.json > /tmp/magistrates-valid.json
          grep -Fq '"records": 75' /tmp/magistrates-valid.json
          docker compose -f compose.local.yaml run --rm --entrypoint python importer /work/importer/discovery.py stage /input/magistrates.json --captured-on "$(date -u +%F)" > /tmp/magistrates-stage.json
          grep -Fq '"published": 0' /tmp/magistrates-stage.json
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM court_discovery_rows;' | grep -Fqx 164
          docker compose -f compose.local.yaml exec -T postgres psql -U courts -d courts -Atc 'SELECT count(*) FROM courts;' | grep -Fqx 0
      - name: Check API and HTML response
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4174/api/v1/health > /tmp/api-health.json
          grep -Fqx '{"status":"ok"}' /tmp/api-health.json
          curl --fail --silent --show-error http://127.0.0.1:4174/api/v1/regions > /tmp/regions.json
          grep -Fqx '[]' /tmp/regions.json
          curl --fail --silent --show-error http://127.0.0.1:4174/api/v1/courts/categories/general-district > /tmp/courts-category.json
          grep -Fqx '[]' /tmp/courts-category.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4174/api/v1/courts/categories/invalid-kind)" = 404
          curl --fail --silent --show-error 'http://127.0.0.1:4174/api/v1/courts/search?q=moscow' > /tmp/courts.json
          grep -Fqx '[]' /tmp/courts.json
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/home.html
          grep -Fq 'Правосудие.' /tmp/home.html
          curl --fail --silent --show-error http://127.0.0.1:4173/courts/arbitration > /tmp/arbitration.html
          grep -Fq 'Арбитражные суды России' /tmp/arbitration.html
          curl --fail --silent --show-error http://127.0.0.1:4173/courts/magistrates > /tmp/magistrates.html
          grep -Fq 'Судебные участки мировых судей' /tmp/magistrates.html
          for page in courts/types courts/types/general-district courts/types/general-regional courts/types/military-garrison courts/types/arbitration-subject; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:4173/$page"
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/judges > /tmp/judges.html
          grep -Fq 'Судьи Российской Федерации' /tmp/judges.html
          for page in courts judges laws practice guides jurisdiction services sources search; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:4173/$page"
          done
      - name: Shut down and clean smoke-test containers
        if: always()
        run: docker compose -f compose.local.yaml down --volumes
